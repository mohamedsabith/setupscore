# The labels of this repository: name, color (6 hex digits, no #) and description (at most 100 characters).
# Create or update them with .github/scripts/sync-labels.sh (it uses the GitHub CLI).
# "from_name" renames an existing label, so the issues that have it keep it.
# Keep this simple format (one "- name:" block per label, values in quotes): the sync script reads only this.
# Issue forms (.github/ISSUE_TEMPLATE/) and workflows use these exact names.

# Type: what kind of report or change this is. One per issue.
- name: 'type: bug'
  color: 'd73a4a'
  description: 'Something crashed or behaved differently from the docs'
  from_name: 'bug'
- name: 'type: false alarm'
  color: 'e99695'
  description: 'setupscore flagged something that is fine'
  from_name: 'false-alarm'
- name: 'type: missed problem'
  color: 'f9d0c4'
  description: "A real problem in a setup that setupscore didn't catch"
- name: 'type: score looks wrong'
  color: 'f7c6c7'
  description: 'A Setup Score, a verdict or an attempt result looks wrong'
- name: 'type: feature'
  color: 'a2eeef'
  description: 'A new command, flag, rule or output'
  from_name: 'enhancement'
- name: 'type: docs'
  color: '0075ca'
  description: 'README, docs/ or examples'
  from_name: 'documentation'
- name: 'type: maintenance'
  color: 'ededed'
  description: 'CI, build, dependencies, refactoring or tests'
- name: 'type: security'
  color: 'b60205'
  description: 'A security fix or hardening. Report vulnerabilities privately: see SECURITY.md'

# Area: which part of setupscore. Set on pull requests from the files they change.
- name: 'area: check'
  color: 'bfdadc'
  description: 'check: finding files, parsing, setupscore.yml, --fix, terminal and JSON output'
- name: 'area: rules'
  color: 'bfdadc'
  description: 'The rules in src/rules and docs/rules.md'
- name: 'area: tasks'
  color: 'bfdadc'
  description: 'Turning git history into tasks, package managers'
- name: 'area: run'
  color: 'bfdadc'
  description: 'run, the Setup Score, report, suggest and watch'
- name: 'area: sandbox'
  color: 'bfdadc'
  description: 'The OS sandbox and its policies'
- name: 'area: agent'
  color: 'bfdadc'
  description: 'The Claude Code adapter, and adapters for other agents'
- name: 'area: action'
  color: 'bfdadc'
  description: 'The GitHub Action (action.yml) and its pull request comment'
- name: 'area: cli'
  color: 'bfdadc'
  description: 'Commands, flags, exit codes and messages'
- name: 'area: ci'
  color: 'bfdadc'
  description: 'Workflows, releases and repository tooling'
- name: 'area: tests'
  color: 'bfdadc'
  description: 'Tests and test fixtures'

# Platform: only happens on this operating system.
- name: 'platform: macos'
  color: 'd4c5f9'
  description: 'Only happens on macOS'
- name: 'platform: linux'
  color: 'd4c5f9'
  description: 'Only happens on Linux'
- name: 'platform: windows'
  color: 'd4c5f9'
  description: 'Only happens on native Windows'
- name: 'platform: wsl'
  color: 'd4c5f9'
  description: 'Only happens in WSL2'

# Agent: support for agents other than Claude Code (see ROADMAP.md).
- name: 'agent: codex'
  color: 'fef2c0'
  description: 'Support for OpenAI Codex (AGENTS.md)'
- name: 'agent: cursor'
  color: 'fef2c0'
  description: 'Support for Cursor (.cursor/rules)'
- name: 'agent: gemini cli'
  color: 'fef2c0'
  description: 'Support for Gemini CLI (GEMINI.md)'

# Status: where the issue is in triage.
- name: 'status: needs triage'
  color: 'fbca04'
  description: "New. A maintainer hasn't looked at it yet"
- name: 'status: needs info'
  color: 'd876e3'
  description: 'Waiting for the reporter. Closed after 21 days without a reply'
- name: 'status: confirmed'
  color: '0e8a16'
  description: 'Reproduced and accepted'
- name: 'status: blocked'
  color: 'e11d21'
  description: 'Waiting on something outside this repository, such as Claude Code or the sandbox runtime'
- name: 'status: stale'
  color: 'cfd3d7'
  description: 'No activity for a while. Set by the Stale workflow, which closes it later'

# Priority
- name: 'priority: high'
  color: 'b60205'
  description: 'Fix before the next release'
- name: 'priority: low'
  color: 'c2e0c6'
  description: 'Nice to have'

# Community. Keep these two names exactly: GitHub shows them to new contributors.
- name: 'good first issue'
  color: '7057ff'
  description: 'Small and well described. A good first contribution'
- name: 'help wanted'
  color: '008672'
  description: 'A pull request would be welcome'

# Planning
- name: 'roadmap'
  color: '5319e7'
  description: 'Accepted for the roadmap (ROADMAP.md). Never closed for inactivity'
- name: 'breaking change'
  color: 'd93f0b'
  description: 'Changes the public contract. Needs a new major version'
- name: 'dependencies'
  color: '0366d6'
  description: 'Dependency updates (Dependabot)'

# Releases: added by the maintainer to the issues and pull requests a release includes.
- name: 'released'
  color: 'bfe5bf'
  description: 'Included in a release. CHANGELOG.md says which one'
- name: 'released on @beta'
  color: 'bfe5bf'
  description: 'Included in a beta prerelease'
- name: 'released on @next'
  color: 'bfe5bf'
  description: 'Included in a next prerelease'

# Resolution: why an issue was closed without a change.
- name: 'resolution: duplicate'
  color: 'cfd3d7'
  description: 'Already reported. See the linked issue'
  from_name: 'duplicate'
- name: 'resolution: works as intended'
  color: 'cfd3d7'
  description: 'setupscore behaves as designed'
- name: 'resolution: out of scope'
  color: 'cfd3d7'
  description: 'Not planned for setupscore. See ROADMAP.md'
  from_name: 'wontfix'
- name: 'resolution: cannot reproduce'
  color: 'cfd3d7'
  description: "We couldn't reproduce it with the details given"
- name: 'resolution: question'
  color: 'cfd3d7'
  description: 'A question. Please ask in Discussions'
  from_name: 'question'
- name: 'resolution: invalid'
  color: 'cfd3d7'
  description: 'Spam, off-topic, or AI-generated content nobody checked'
  from_name: 'invalid'
