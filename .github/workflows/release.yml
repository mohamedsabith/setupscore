name: Release

# Push a version tag like v1.0.1 to publish. Uses npm trusted publishing (OIDC):
# no npm token is stored in GitHub, and provenance is attached automatically.
# Only full version tags start a release. The moving major tag (v1) that users pin
# the action to does not; this workflow moves it after a successful publish.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # v1.0.2: published as "latest", moves v1
      - 'v[0-9]+.[0-9]+.[0-9]+-*' # v1.1.0-beta.1: a prerelease, published as "next"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and move the major tag (v1)
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, to find the newest release of the major
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1

      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci
      - name: Install the Linux sandbox tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm run typecheck
      - run: npm test

      # Prereleases (a "-" in the version) go to the "next" dist-tag, so `npm install setupscore`
      # keeps getting the newest stable version. A version that is already on npm is skipped,
      # so a failed release can be re-run.
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -n "$(npm view "setupscore@$version" version 2> /dev/null)" ]; then
            echo "setupscore@$version is already on npm, so it is not published again."
          elif [[ "$version" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The GitHub release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag ${prerelease[@]+"${prerelease[@]}"} \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)."

      # Users pin the action to the major tag (mohamedsabith/setupscore@v1). Move it to this
      # release, unless this is a prerelease or an older line than the newest release of the major.
      # Needs contents: write (above). If a tag ruleset protects v* tags, let GitHub Actions bypass it.
      - name: Move the major tag
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          newest=$(git tag --list "$major.*" --sort=-v:refname | awk '!/-/ && !found { print; found = 1 }')
          if [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "$newest is newer than $GITHUB_REF_NAME, so $major stays where it is."
            exit 0
          fi
          git tag -f "$major" "$GITHUB_REF_NAME^{commit}"
          git push -f origin "refs/tags/$major"
          echo "$major now points at $GITHUB_REF_NAME."
